     <div class="container">
        <h2>Contact Me</h2>
     <form id="contact-form" action="#" method="post" novalidate>
      <!--Name Field-->
      <div class="form-field">
      <label for="name">Name <span aria-hidden="true">*</span></label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required autocomplete="name">
      </div>
      <!--Email Fieldd-->
      <div class="form-field">
        <label for="email">Email <span aria-hidden="true">*</span></label>
        <input type="email" id="email" name="email" placeholder="Your@gmail.com" required autocomplete="email" />
      </div>
      <!--Message Field-->
      <div class="form-field">
        <label for="message">Message <span aria-hidden="true">*</span></label>
        <textarea id="message" name="message" rows="4" placeholder="Your message here" required></textarea>
      </div>
      <!--Submit Button-->
      <button type="submit" class="btn">Send</button>
     </form>
     <p id="form-message" aria-live="polite" role="status"></p>
     </div>
    <!--JavaScript for BacktoTop-->
        <button id="back-to-top" title="back-to-top">🔼</button>
        
        <script type="module" src="js/main.js"></script>
